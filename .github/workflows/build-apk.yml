name: Build NovaPlay Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Scaffold Android WebView APK Project if missing
    run: |
      if [ ! -f "app/build.gradle.kts" ]; then
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/novaplay/utility
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        if [ -f "novaplay_mobile_apk.html" ]; then
          cp novaplay_mobile_apk.html app/src/main/assets/index.html
        elif [ -f "index.html" ]; then
          cp index.html app/src/main/assets/index.html
        else
          echo "<h1>NovaPlay & Utility</h1>" > app/src/main/assets/index.html
        fi

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NovaPlayUtility"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.novaplay.utility"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.novaplay.utility"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(
                        getDefaultProguardFile("proguard-android-optimize.txt"),
                        "proguard-rules.pro"
                    )
                }
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            implementation("com.google.android.material:material:1.12.0")
        }
        EOF

        touch app/proguard-rules.pro

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">NovaPlay &amp; Utility</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.NovaPlay" parent="Theme.Material3.Dark.NoActionBar">
                <item name="colorPrimary">#06B6D4</item>
                <item name="colorSurface">#07080E</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:theme="@style/Theme.NovaPlay"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout
            xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:id="@+id/mainRootLayout"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#07080E">

            <WebView
                android:id="@+id/novaplayWebView"
                android:layout_width="0dp"
                android:layout_height="0dp"
                app:layout_constraintTop_toTopOf="parent"
                app:layout_constraintBottom_toBottomOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintEnd_toEndOf="parent" />

        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/novaplay/utility/MainActivity.kt
        package com.novaplay.utility

        import android.annotation.SuppressLint
        import android.os.Bundle
        import android.view.View
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import androidx.activity.OnBackPressedCallback
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.view.WindowCompat

        class MainActivity : AppCompatActivity() {

            private lateinit var webView: WebView

            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                window.statusBarColor = android.graphics.Color.parseColor("#07080E")
                window.navigationBarColor = android.graphics.Color.parseColor("#0B0D15")
                val controller = WindowCompat.getInsetsController(window, window.decorView)
                controller.isAppearanceLightStatusBars = false
                controller.isAppearanceLightNavigationBars = false

                setContentView(R.layout.activity_main)
                webView = findViewById(R.id.novaplayWebView)

                configureWebView(webView)
                setupBackNavigation()

                webView.loadUrl("file:///android_asset/index.html")
            }

            @SuppressLint("SetJavaScriptEnabled")
            private fun configureWebView(view: WebView) {
                view.setBackgroundColor(android.graphics.Color.parseColor("#07080E"))
                view.overScrollMode = View.OVER_SCROLL_NEVER

                val settings: WebSettings = view.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.databaseEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                settings.mediaPlaybackRequiresUserGesture = false
                settings.cacheMode = WebSettings.LOAD_DEFAULT
                settings.useWideViewPort = true
                settings.loadWithOverviewMode = true
                settings.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE

                view.webViewClient = object : WebViewClient() {
                    override fun onPageFinished(view: WebView?, url: String?) {
                        super.onPageFinished(view, url)
                        view?.evaluateJavascript(
                            "document.documentElement.style.webkitTouchCallout='none';",
                            null
                        )
                    }
                }
                view.webChromeClient = WebChromeClient()
            }

            private fun setupBackNavigation() {
                onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                    override fun handleOnBackPressed() {
                        if (::webView.isInitialized && webView.canGoBack()) {
                            webView.goBack()
                        } else {
                            isEnabled = false
                            onBackPressedDispatcher.onBackPressed()
                        }
                    }
                })
            }

            override fun onResume() {
                super.onResume()
                if (::webView.isInitialized) {
                    webView.onResume()
                    webView.resumeTimers()
                }
            }

            override fun onPause() {
                if (::webView.isInitialized) {
                    webView.onPause()
                    webView.pauseTimers()
                }
                super.onPause()
            }

            override fun onDestroy() {
                if (::webView.isInitialized) {
                    webView.stopLoading()
                    webView.destroy()
                }
                super.onDestroy()
            }
        }
        EOF
      fi

  - name: Ensure latest HTML UI is bundled into assets
    run: |
      mkdir -p app/src/main/assets
      if [ -f "novaplay_mobile_apk.html" ]; then
        cp novaplay_mobile_apk.html app/src/main/assets/index.html
      elif [ -f "index.html" ]; then
        cp index.html app/src/main/assets/index.html
      fi

  - name: Grant execute permission for Gradle wrapper
    run: |
      if [ ! -f "./gradlew" ]; then
        gradle wrapper --gradle-version 8.7
      fi
      chmod +x gradlew

  - name: Build Debug APK
    run: ./gradlew assembleDebug

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: NovaPlay-Utility-APK
      path: app/build/outputs/apk/debug/app-debug.apk
