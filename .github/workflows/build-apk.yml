name: Build NovaPlay Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v3

  - name: Prepare Android project structure
    run: |
      mkdir -p app/src/main/java/com/novaplay/utility
      mkdir -p app/src/main/res/layout
      mkdir -p app/src/main/res/values
      mkdir -p app/src/main/assets

      if [ -f "novaplay_mobile_apk.html" ]; then
        cp novaplay_mobile_apk.html app/src/main/assets/index.html
      elif [ -f "index.html" ]; then
        cp index.html app/src/main/assets/index.html
      else
        printf '<!DOCTYPE html><html><body style="background:#07080e;color:#fff;font-family:sans-serif;padding:24px;"><h2>NovaPlay & Utility</h2><p>Add novaplay_mobile_apk.html or index.html to repository root.</p></body></html>\n' > app/src/main/assets/index.html
      fi

      cat << 'EOF' > settings.gradle
      rootProject.name = "NovaPlayUtility"
      include ":app"
      EOF

      cat << 'EOF' > build.gradle
      buildscript {
          ext.kotlin_version = '1.9.24'
          repositories {
              google()
              mavenCentral()
          }
          dependencies {
              classpath 'com.android.tools.build:gradle:8.5.2'
              classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
          }
      }
      allprojects {
          repositories {
              google()
              mavenCentral()
          }
      }
      EOF

      cat << 'EOF' > app/build.gradle
      plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
      }

      android {
          namespace 'com.novaplay.utility'
          compileSdk 34

          defaultConfig {
              applicationId "com.novaplay.utility"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
          }

          buildTypes {
              release {
                  minifyEnabled false
              }
              debug {
                  minifyEnabled false
              }
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = '17'
          }
      }

      dependencies {
          implementation 'androidx.core:core-ktx:1.13.1'
          implementation 'androidx.appcompat:appcompat:1.7.0'
          implementation 'com.google.android.material:material:1.12.0'
          implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
      }
      EOF

      cat << 'EOF' > app/src/main/AndroidManifest.xml
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

          <application
              android:allowBackup="true"
              android:label="NovaPlay &amp; Utility"
              android:theme="@style/Theme.AppCompat.NoActionBar"
              android:usesCleartextTraffic="true">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>

          </application>
      </manifest>
      EOF

      cat << 'EOF' > app/src/main/res/layout/activity_main.xml
      <?xml version="1.0" encoding="utf-8"?>
      <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent"
          android:background="#07080E">

          <WebView
              android:id="@+id/novaplayWebView"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />

      </FrameLayout>
      EOF

      cat << 'EOF' > app/src/main/java/com/novaplay/utility/MainActivity.kt
      package com.novaplay.utility

      import android.annotation.SuppressLint
      import android.os.Bundle
      import android.webkit.WebChromeClient
      import android.webkit.WebSettings
      import android.webkit.WebView
      import android.webkit.WebViewClient
      import androidx.appcompat.app.AppCompatActivity

      class MainActivity : AppCompatActivity() {

          private lateinit var webView: WebView

          @SuppressLint("SetJavaScriptEnabled")
          override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContentView(R.layout.activity_main)

              webView = findViewById(R.id.novaplayWebView)
              webView.setBackgroundColor(android.graphics.Color.parseColor("#07080E"))

              val settings: WebSettings = webView.settings
              settings.javaScriptEnabled = true
              settings.domStorageEnabled = true
              settings.databaseEnabled = true
              settings.allowFileAccess = true
              settings.mediaPlaybackRequiresUserGesture = false
              settings.useWideViewPort = true
              settings.loadWithOverviewMode = true

              webView.webViewClient = WebViewClient()
              webView.webChromeClient = WebChromeClient()

              webView.loadUrl("file:///android_asset/index.html")
          }

          @Deprecated("Deprecated in Java")
          override fun onBackPressed() {
              if (::webView.isInitialized && webView.canGoBack()) {
                  webView.goBack()
              } else {
                  @Suppress("DEPRECATION")
                  super.onBackPressed()
              }
          }
      }
      EOF

      gradle wrapper --gradle-version 8.7

  - name: Build Debug APK
    run: ./gradlew assembleDebug

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: NovaPlay-Utility-APK
      path: app/build/outputs/apk/debug/app-debug.apk
