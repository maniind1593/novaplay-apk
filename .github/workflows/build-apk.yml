        cat << 'EOF' > app/src/main/java/com/novaplay/utility/MainActivity.kt


package com.novaplay.utility

import android.annotation.SuppressLint
import android.os.Bundle
import android.view.View
import android.webkit.WebChromeClient
import android.webkit.WebSettings
import android.webkit.WebView
import android.webkit.WebViewClient
import androidx.activity.OnBackPressedCallback
import androidx.appcompat.app.AppCompatActivity
import androidx.core.view.WindowCompat

class MainActivity : AppCompatActivity() {

private lateinit var webView: WebView

@SuppressLint("SetJavaScriptEnabled")
override fun onCreate(savedInstanceState: Bundle?) {
    super.onCreate(savedInstanceState)

    window.statusBarColor = android.graphics.Color.parseColor("#07080E")
    window.navigationBarColor = android.graphics.Color.parseColor("#0B0D15")
    val controller = WindowCompat.getInsetsController(window, window.decorView)
    controller.isAppearanceLightStatusBars = false
    controller.isAppearanceLightNavigationBars = false

    setContentView(R.layout.activity_main)
    webView = findViewById(R.id.novaplayWebView)

    configureWebView(webView)
    setupBackNavigation()

    webView.loadUrl("file:///android_asset/index.html")
}

@SuppressLint("SetJavaScriptEnabled")
private fun configureWebView(view: WebView) {
    view.setBackgroundColor(android.graphics.Color.parseColor("#07080E"))
    view.overScrollMode = View.OVER_SCROLL_NEVER

    val settings: WebSettings = view.settings
    settings.javaScriptEnabled = true
    settings.domStorageEnabled = true
    settings.databaseEnabled = true
    settings.allowFileAccess = true
    settings.allowContentAccess = true
    settings.mediaPlaybackRequiresUserGesture = false
    settings.cacheMode = WebSettings.LOAD_DEFAULT
    settings.useWideViewPort = true
    settings.loadWithOverviewMode = true
    settings.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE

    view.webViewClient = object : WebViewClient() {
        override fun onPageFinished(view: WebView?, url: String?) {
            super.onPageFinished(view, url)
            view?.evaluateJavascript(
                "document.documentElement.style.webkitTouchCallout='none';",
                null
            )
        }
    }
    view.webChromeClient = WebChromeClient()
}

private fun setupBackNavigation() {
    onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
        override fun handleOnBackPressed() {
            if (::webView.isInitialized && webView.canGoBack()) {
                webView.goBack()
            } else {
                isEnabled = false
                onBackPressedDispatcher.onBackPressed()
            }
        }
    })
}

override fun onResume() {
    super.onResume()
    if (::webView.isInitialized) {
        webView.onResume()
        webView.resumeTimers()
    }
}

override fun onPause() {
    if (::webView.isInitialized) {
        webView.onPause()
        webView.pauseTimers()
    }
    super.onPause()
}

override fun onDestroy() {
    if (::webView.isInitialized) {
        webView.stopLoading()
        webView.destroy()
    }
    super.onDestroy()
}


}
