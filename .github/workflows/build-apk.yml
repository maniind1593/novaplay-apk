name: Build NovaPlay Android APK

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: "17"
      distribution: "temurin"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v3

  - name: Create Android WebView project structure
    shell: bash
    run: |
      set -e
      mkdir -p app/src/main/java/com/novaplay/utility
      mkdir -p app/src/main/res/layout
      mkdir -p app/src/main/res/values
      mkdir -p app/src/main/assets

      if [ -f "novaplay_mobile_apk.html" ]; then
        cp novaplay_mobile_apk.html app/src/main/assets/index.html
      elif [ -f "index.html" ]; then
        cp index.html app/src/main/assets/index.html
      else
        printf '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NovaPlay &amp; Utility</title></head><body style="background:#07080e;color:#fff;font-family:sans-serif;padding:24px;"><h2>NovaPlay &amp; Utility</h2><p>APK build succeeded.</p></body></html>\n' > app/src/main/assets/index.html
      fi

      cat << 'EOF' > settings.gradle.kts
      pluginManagement {
        repositories {
          google()
          mavenCentral()
          gradlePluginPortal()
        }
      }
      dependencyResolutionManagement {
        repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
        repositories {
          google()
          mavenCentral()
        }
      }
      rootProject.name = "NovaPlayUtility"
      include(":app")
      EOF

      cat << 'EOF' > build.gradle.kts
      plugins {
        id("com.android.application") version "8.5.2" apply false
        id("org.jetbrains.kotlin.android") version "1.9.24" apply false
      }
      EOF

      cat << 'EOF' > app/build.gradle.kts
      plugins {
        id("com.android.application")
        id("org.jetbrains.kotlin.android")
      }

      android {
        namespace = "com.novaplay.utility"
        compileSdk = 34

        defaultConfig {
          applicationId = "com.novaplay.utility"
          minSdk = 24
          targetSdk = 34
          versionCode = 1
          versionName = "1.0.0"
        }

        buildTypes {
          release {
            isMinifyEnabled = false
          }
        }

        compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
        }

        kotlinOptions {
          jvmTarget = "17"
        }
      }

      dependencies {
        implementation("androidx.core:core-ktx:1.13.1")
        implementation("androidx.appcompat:appcompat:1.7.0")
        implementation("androidx.constraintlayout:constraintlayout:2.1.4")
      }
      EOF

      cat << 'EOF' > app/src/main/AndroidManifest.xml
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <uses-permission android:name="android.permission.INTERNET" />
        <application
          android:allowBackup="true"
          android:label="NovaPlay &amp; Utility"
          android:theme="@style/Theme.AppCompat.NoActionBar"
          android:usesCleartextTraffic="true">
          <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
              <action android:name="android.intent.action.MAIN" />
              <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
          </activity>
        </application>
      </manifest>
      EOF

      cat << 'EOF' > app/src/main/res/layout/activity_main.xml
      <?xml version="1.0" encoding="utf-8"?>
      <androidx.constraintlayout.widget.ConstraintLayout
        xmlns:android="http://schemas.android.com/apk/res/android"
        xmlns:app="http://schemas.android.com/apk/res-auto"
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:background="#07080E">

        <WebView
          android:id="@+id/novaplayWebView"
          android:layout_width="0dp"
          android:layout_height="0dp"
          app:layout_constraintTop_toTopOf="parent"
          app:layout_constraintBottom_toBottomOf="parent"
          app:layout_constraintStart_toStartOf="parent"
          app:layout_constraintEnd_toEndOf="parent" />
      </androidx.constraintlayout.widget.ConstraintLayout>
      EOF

      cat << 'EOF' > app/src/main/java/com/novaplay/utility/MainActivity.kt
      package com.novaplay.utility

      import android.annotation.SuppressLint
      import android.os.Bundle
      import android.webkit.WebChromeClient
      import android.webkit.WebSettings
      import android.webkit.WebView
      import android.webkit.WebViewClient
      import androidx.appcompat.app.AppCompatActivity

      class MainActivity : AppCompatActivity() {
        private lateinit var webView: WebView

        @SuppressLint("SetJavaScriptEnabled")
        override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          setContentView(R.layout.activity_main)
          webView = findViewById(R.id.novaplayWebView)

          val settings: WebSettings = webView.settings
          settings.javaScriptEnabled = true
          settings.domStorageEnabled = true
          settings.allowFileAccess = true
          settings.mediaPlaybackRequiresUserGesture = false

          webView.webViewClient = WebViewClient()
          webView.webChromeClient = WebChromeClient()
          webView.loadUrl("file:///android_asset/index.html")
        }
      }
      EOF

  - name: Assemble Debug APK
    shell: bash
    run: gradle assembleDebug

  - name: Upload Debug APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: NovaPlay-Utility-APK
      path: app/build/outputs/apk/debug/app-debug.apk
