  - name: Ensure latest HTML UI is bundled into assets
    run: |
      mkdir -p app/src/main/assets
      if [ -f "novaplay_mobile_apk.html" ]; then
        cp novaplay_mobile_apk.html app/src/main/assets/index.html
      elif [ -f "index.html" ]; then
        cp index.html app/src/main/assets/index.html
      fi

  - name: Build Debug APK with Gradle
    run: gradle assembleDebug --no-daemon

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: NovaPlay-Utility-APK
      path: app/build/outputs/apk/debug/app-debug.apk
